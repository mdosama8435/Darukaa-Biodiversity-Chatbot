services:
  db:
    image: pgvector/pgvector:pg16
    container_name: darukaa_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-darukaa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-darukaa_password_change_in_production}
      POSTGRES_DB: ${POSTGRES_DB:-darukaa_earth}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-darukaa} -d ${POSTGRES_DB:-darukaa_earth}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - darukaa_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: darukaa_backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-true}
      PROJECT_NAME: ${PROJECT_NAME:-DARUKAA.EARTH AI Biodiversity Intelligence}
      API_V1_STR: ${API_V1_STR:-/api/v1}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000","http://localhost:3001","http://localhost:5173","http://127.0.0.1:3000","http://127.0.0.1:3001","http://127.0.0.1:5173"]}
      POSTGRES_SERVER: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-darukaa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-darukaa_password_change_in_production}
      POSTGRES_DB: ${POSTGRES_DB:-darukaa_earth}
      DATABASE_URL: postgresql://${POSTGRES_USER:-darukaa}:${POSTGRES_PASSWORD:-darukaa_password_change_in_production}@db:5432/${POSTGRES_DB:-darukaa_earth}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-384}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_MODEL: ${LLM_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://localhost:11434}
    ports:
      - "8000:8000"
    volumes:
      - ./knowledge:/app/knowledge:ro
      - ./backend/app:/app/app:ro
      - ./backend/tests:/app/tests:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - darukaa_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: darukaa_frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://backend:8000}
    ports:
      - "${FRONTEND_PORT:-3001}:80"
    depends_on:
      - backend
    networks:
      - darukaa_network

volumes:
  postgres_data:
    driver: local

networks:
  darukaa_network:
    driver: bridge
